<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>森林动物合成乐园 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12271c;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none}#game{position:fixed;inset:0;display:grid;place-items:center}canvas{display:block;touch-action:none;box-shadow:0 16px 70px #07130c}
#hud{position:fixed;inset:0;pointer-events:none;color:#60422f}.pill{position:absolute;background:#fff1d8eF;border:2px solid #fff7;box-shadow:0 6px 18px #19362145;border-radius:22px}.score{left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);width:190px;height:66px;text-align:center;padding-top:7px;font-weight:900;font-size:25px}.score small{display:block;font-size:12px;color:#826d5d}.gear{right:calc(50% - min(48vw,340px));top:max(18px,env(safe-area-inset-top));width:50px;height:50px;border:0;border-radius:50%;background:#f2a56c;color:#fff;font-size:24px;pointer-events:auto}.chain{left:50%;top:91px;transform:translateX(-50%);width:min(82vw,590px);height:62px;padding:7px 12px;display:flex;align-items:center;justify-content:space-around;font-size:18px}.chain span{filter:drop-shadow(0 2px 2px #0002)}.next{left:50%;bottom:76px;transform:translateX(-50%);width:142px;height:59px;text-align:center;padding:7px;font-weight:800}.next b{font-size:27px;margin-left:10px}.hint{position:absolute;left:50%;bottom:19px;transform:translateX(-50%);background:#173b2bdd;color:white;border-radius:20px;padding:7px 14px;font-size:12px;white-space:nowrap}.danger{display:none;left:50%;top:164px;transform:translateX(-50%);background:#d94e43;color:#fff;padding:9px 20px;border-radius:17px;font-weight:900}.power{display:none;left:50%;bottom:148px;transform:translateX(-50%);width:210px;height:16px;background:#153520aa;border:2px solid #fff7;border-radius:10px;overflow:hidden}.power i{display:block;height:100%;width:0;background:linear-gradient(90deg,#69d36b,#ffd45c,#ef604d)}
#modal{display:none;position:fixed;inset:0;background:#102519b8;z-index:5;place-items:center}.card{width:min(78vw,480px);background:#fff5df;border-radius:28px;padding:28px;text-align:center;color:#684936;box-shadow:0 20px 70px #0007}.card h2{margin:0 0 24px}.card button{display:block;width:100%;border:0;border-radius:18px;padding:15px;margin:12px 0;color:#fff;font-size:19px;font-weight:900;background:#72a65f}.card .sound{background:#e4a45e}.card .reset{background:#df8065}
</style></head><body><div id="game"></div><div id="hud"><div class="pill score">⭐ <span id="score">0</span><small>最高分 <span id="best">0</span></small></div><button class="gear" id="gear">⚙</button><div class="pill chain" id="chain"></div><div class="pill next">下一个 <b id="next">🐥</b></div><div class="pill danger" id="danger">危险 3</div><div class="power" id="power"><i></i></div><div class="hint">按住动物向后拖，松手发射</div></div><div id="modal"><div class="card"><h2 id="modalTitle">游戏暂停</h2><button id="resume">继续游戏</button><button class="sound" id="sound">🔊 音效：开</button><button class="reset" id="reset">重新开始</button></div></div><script src="three.min.js"></script><script src="game.js"></script></body></html>
